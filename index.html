<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINETRACK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .light-mode { background-color: #f8fafc !important; color: #1e293b !important; }
        .light-mode .bg-slate-800 { background-color: #e2e8f0 !important; }
        .light-mode .text-slate-100 { color: #1e293b !important; }
        .light-mode .text-slate-400 { color: #64748b !important; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 p-8">
    <header class="max-w-7xl mx-auto flex justify-between mb-8">
        <h1 class="text-3xl font-black">CINETRACK</h1>
        <button id="theme-toggle" class="bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold">LIGHT MODE</button>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-4 gap-8">
        <aside class="col-span-1 bg-slate-800 p-6 rounded-2xl h-fit">
            <h2 class="text-xs font-bold uppercase mb-4 text-slate-400">Search Controls</h2>
            <div class="flex gap-2 mb-4">
                <button id="show-mode-btn" class="flex-1 bg-indigo-600 py-2 rounded-lg text-sm font-bold">Shows</button>
                <button id="actor-mode-btn" class="flex-1 bg-slate-700 py-2 rounded-lg text-sm font-bold">Actors</button>
            </div>
            <button id="shuffle-btn" class="w-full bg-slate-700 py-3 rounded-lg mb-4 font-bold text-sm">SHUFFLE FEED</button>
            <div class="text-center pt-6 border-t border-slate-700">
                <a href="https://www.tvmaze.com/api" target="_blank" class="text-indigo-400 text-xs font-bold">TVMAZE API LINKED</a>
            </div>
        </aside>

        <section class="col-span-3">
            <div id="resultsGrid" class="grid grid-cols-3 gap-6"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
