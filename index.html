<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINETRACK</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <main class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-4">CINETRACK</h1>
        <div class="flex gap-2">
            <input id="searchInput" type="text" placeholder="Search TV shows..." class="border p-2 flex-grow rounded">
            <button id="searchBtn" class="bg-blue-600 text-white px-4 py-2 rounded">Search</button>
        </div>
        <div id="status" class="mt-4 text-gray-600"></div>
        <section id="results" class="mt-6 grid gap-4"></section>
    </main>

    <script>
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        const results = document.getElementById('results');
        const status = document.getElementById('status');

        searchBtn.addEventListener('click', async () => {
            const query = searchInput.value;
            if (!query) return;

            // Loading state
            status.textContent = "Loading...";
            results.innerHTML = "";

            try {
                const response = await fetch(`https://api.tvmaze.com/search/shows?q=${query}`);
                const data = await response.json();

                status.textContent = "";
                if (data.length === 0) {
                    status.textContent = "No results found.";
                    return;
                }

                data.forEach(item => {
                    const show = item.show;
                    const div = document.createElement('div');
                    div.className = "bg-white p-4 shadow rounded";
                    div.innerHTML = `
                        <h2 class="font-bold text-lg">${show.name}</h2>
                        <p class="text-sm">${show.summary ? show.summary.slice(0, 100) + '...' : 'No summary.'}</p>
                    `;
                    results.appendChild(div);
                });
            } catch (error) {
                status.textContent = "Error fetching data.";
            }
        });
    </script>
</body>
</html>
