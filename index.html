<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body.light-mode { background-color: #f1f5f9; color: #1e293b; }
        body.light-mode .bg-slate-900 { background-color: #e2e8f0; }
        body.light-mode .bg-[#1e293b] { background-color: #ffffff; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-black italic tracking-tighter text-white">CINETRACK</h1>
            <button id="theme-toggle" class="bg-slate-700 px-4 py-2 rounded-lg font-bold">Toggle Theme</button>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <aside class="space-y-6">
                <div class="flex gap-2">
                    <button id="mode-shows" class="flex-1 py-2 rounded bg-indigo-600 font-bold">Shows</button>
                    <button id="mode-actors" class="flex-1 py-2 rounded bg-slate-700 font-bold">Actors</button>
                </div>
                <button id="shuffle-btn" class="w-full bg-slate-800 py-2 rounded">Shuffle Feed</button>
                <div class="border-t border-slate-700 pt-4">
                    <h3 class="font-bold mb-2">SAVED LIST</h3>
                    <ul id="saved-list" class="space-y-2"></ul>
                </div>
            </aside>
            <main class="md:col-span-3">
                <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </main>
        </div>
    </div>
    <div id="infoModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 p-6 rounded-xl w-full max-w-md">
            <h2 id="modalTitle" class="text-2xl font-bold mb-2"></h2>
            <p id="modalSummary" class="text-slate-300 mb-6 text-sm"></p>
            <div class="flex flex-col gap-2">
                <button id="mustWatchToggle" class="bg-orange-600 py-2 rounded font-bold">Must Watch</button>
                <a id="modalLink" href="#" target="_blank" class="block bg-indigo-600 text-center py-2 rounded">View Details</a>
                <button id="closeModal" class="bg-slate-700 py-2 rounded">Close</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
