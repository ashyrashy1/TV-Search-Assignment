<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack - Global TV & Actor Discovery Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="body-theme" class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased transition-colors duration-300">

    <header id="header-theme" class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span id="logo-text" class="text-xl font-black tracking-tight text-white uppercase bg-clip-text bg-gradient-to-r from-indigo-400 to-violet-400">CineTrack</span>
                <a href="https://api.tvmaze.com/" target="_blank" rel="noopener noreferrer" class="hidden md:inline-flex text-[10px] uppercase font-bold tracking-widest bg-slate-800 border border-slate-700/60 hover:border-indigo-500 text-slate-400 hover:text-white px-2.5 py-1 rounded-md transition-all shadow-inner">
                    TVMaze API Linked ↗
                </a>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="watchlist-box" class="bg-slate-800 border border-slate-700/60 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs font-bold shadow-sm">
                    <span>❤️ Session Saves</span>
                    <span id="watchlist-count" class="bg-indigo-600 text-white px-2 py-0.5 rounded-md">0</span>
                </div>
                <button id="theme-toggle-btn" class="p-2 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-sm rounded-xl transition-all font-semibold text-white flex items-center gap-1.5 shadow-md">
                    <span id="theme-icon">☀️</span>
                    <span id="theme-text" class="hidden sm:inline">Light Mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <section class="lg:col-span-1">
                <div id="sidebar-card" class="bg-slate-800/40 border border-slate-800 p-5 rounded-2xl shadow-xl backdrop-blur-sm sticky top-24">
                    <h2 id="settings-heading" class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Search Controls</h2>
                    
                    <div id="mode-switch-box" class="bg-slate-900/60 p-1 rounded-xl flex gap-1 mb-4 border border-slate-800">
                        <button id="show-mode-btn" class="flex-1 text-center text-sm font-medium py-2 rounded-lg bg-indigo-600 text-white transition-all shadow-md">Shows</button>
                        <button id="actor-mode-btn" class="flex-1 text-center text-sm font-medium py-2 rounded-lg text-slate-400 hover:text-slate-200 transition-all">Actors</button>
                    </div>

                    <button id="shuffle-btn" class="w-full bg-slate-800 hover:bg-slate-700/80 text-indigo-400 border border-slate-700/80 py-2.5 rounded-xl text-sm font-bold tracking-wide shadow-md transition-all flex items-center justify-center gap-2">
                        🎲 Shuffle Feed
                    </button>
                </div>
            </section>

            <section class="lg:col-span-3">
                <div class="flex gap-3 mb-6">
                    <input type="text" id="search-input" placeholder="Search live shows..." class="w-full bg-slate-800/80 border border-slate-700/50 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 shadow-inner transition-all">
                    <button id="search-button" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 rounded-xl text-sm font-bold transition-all shadow-lg active:scale-95">
                        Search
                    </button>
                </div>

                <div id="results-grid" aria-live="polite" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                    <div class="col-span-full text-center text-slate-500 py-12">Initialising real-time TVMaze data stream...</div>
                </div>
            </section>
        </div>
    </main>

    <div id="detail-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div id="modal-backdrop-close" class="absolute inset-0 cursor-pointer"></div>
        <div id="modal-container" class="bg-slate-800 border border-slate-700/80 rounded-3xl max-w-xl w-full overflow-hidden shadow-2xl relative p-6 text-white transform scale-95 transition-all duration-300 z-10">
            <button id="close-modal-btn" type="button" aria-label="Close details" class="absolute top-4 right-4 text-slate-400 hover:text-white font-black text-2xl w-10 h-10 flex items-center justify-center bg-slate-900/50 rounded-full transition-colors z-50 cursor-pointer border border-slate-700/40 shadow-md">
                &times;
            </button>
            <div id="modal-body-content" class="mt-4">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
